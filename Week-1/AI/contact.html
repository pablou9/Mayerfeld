<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Vómer Physiotherapy</title>
</head>
<body>
    <header>
        <h1>Vómer</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Vómer</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in touch</h2>
            <p>
                Fill out the form and we will contact you.
            </p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact form</legend>

                    <p>
                        <label for="nombre">Name:</label><br>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>

                    <p>
                        <label for="email">Email address:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="telefono">Phone:</label><br>
                        <input type="tel" id="telefono" name="telefono">
                    </p>

                    <p>
                        <label for="servicio">Service of interest:</label><br>
                        <select id="servicio" name="servicio">
                            <option value="sports-physiotherapy">Sports physiotherapy</option>
                            <option value="rehabilitation">Rehabilitation</option>
                            <option value="manual-therapy">Manual therapy</option>
                            <option value="therapeutic-exercise">Therapeutic exercise</option>
                            <option value="other">Other</option>
                        </select>
                    </p>

                    <p>
                        <label for="mensaje">Message:</label><br>
                        <textarea id="mensaje" name="mensaje" rows="6" cols="40" required></textarea>
                    </p>

                    <p>
                        <button type="submit">Send message</button>
                        <button type="reset">Clear form</button>
                    </p>
                </fieldset>
            </form>
        </section>

        <aside>
            <h2>Information</h2>
            <address>
                Vómer Physiotherapy<br>
                Health Street, 25<br>
                Madrid, Spain<br>
                <a href="mailto:info@vomer.es">info@vomer.es</a>
            </address>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Vómer Physiotherapy.</p>
    </footer>
</body>
</html>
